worker_processes 1;
pid /tmp/nginx_standby.pid;
error_log /tmp/nginx_standby_error.log;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx_standby_access.log;

    upstream my_backends {
        server 127.0.0.13:3001 max_fails=2 fail_timeout=5s;
        server 127.0.0.14:3001 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 127.0.0.14:443 ssl;
        server_name app.packettracers.test api.packettracers.test;

        ssl_certificate /opt/homebrew/etc/nginx/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/server.key;

        location / {
            proxy_bind 127.0.0.14;
            proxy_method GET;
            proxy_pass http://my_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
