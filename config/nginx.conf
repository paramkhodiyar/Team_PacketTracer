    #    }
    #}


    # HTTPS server
    #
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;

    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}
    include servers/*;



upstream my_backends {
    server 10.7.27.90:3001;
    server 10.7.5.26:3001;
}

server {
    listen 443 ssl;
    # Fixed the typo to include the 's' in packettracers
    server_name app.packettracers.test api.packettracers.test;

    ssl_certificate /opt/homebrew/etc/nginx/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/server.key;

    location / {
        # Translate HEAD to GET so your backend doesn't throw a 501 error
        proxy_method GET;

        # Inject the rubric's caching headers
        add_header Cache-Control "max-age=60";
        add_header ETag '"v1.0-packettracers"';
        add_header X-Backend $upstream_addr;

        proxy_pass http://my_backends;
    }

}
}
